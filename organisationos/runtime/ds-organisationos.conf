# Exact runtime identity must never be cached with the versioned application assets.
location = /web-apps/organisationos/runtime.json {
  alias /var/www/onlyoffice/documentserver/web-apps/organisationos/runtime.json;
  default_type application/json;
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
}
