name: check
on: [push]
jobs:
  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install rumdl
        uses: rvben/rumdl@v0.3.0
        with:
          version: "0.3.0"
          install-only: true
      - name: run rumdl
        run: |
          git ls-files -z -- '*.md' |
            xargs -0 -r rumdl check --config .rumdl.toml --no-cache \
              --deny-config-warnings --
  spellchecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: setup aspell
        run: sudo apt-get -y update && sudo apt-get -y install aspell aspell-en
      - name: run spellchecker
        run: |
          SPELLCHECK_OUT=$(cat CHANGELOG.md | aspell --lang=en --encoding=utf-8 --personal=./.aspell.en.pws list)
          echo $SPELLCHECK_OUT
          if [[ $(echo -n $SPELLCHECK_OUT | wc -c) -ne 0 ]]; then exit 1 ; fi
